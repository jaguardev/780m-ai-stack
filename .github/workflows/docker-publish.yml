name: Build and Push Docker Images

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: "Docker image name (without tag)"
        required: false
        default: "vladchernikov/rocm"
        type: string
      ollama_tag:
        description: "Tag for ollama target"
        required: false
        default: ""
        type: string
      comfyui_tag:
        description: "Tag for comfyui target"
        required: false
        default: ""
        type: string
      rocm_downloads_url:
        description: "ROCm wheels index URL"
        required: false
        default: "https://rocm.nightlies.amd.com/whl-multi-arch/"
        type: string
      gpu_arch:
        description: "GPU architecture"
        required: false
        default: "gfx1103"
        type: string
      device_version:
        description: "PyTorch device extra (defaults to device-<gpu_arch>)"
        required: false
        default: ""
        type: string
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          image_name="${{ github.event.inputs.image_name }}"
          if [ -z "$image_name" ]; then
            image_name="${{ secrets.DOCKERHUB_USERNAME }}/rocm"
          fi

          rocm_downloads_url="${{ github.event.inputs.rocm_downloads_url }}"
          if [ -z "$rocm_downloads_url" ]; then
            rocm_downloads_url="https://rocm.nightlies.amd.com/whl-multi-arch/"
          fi

          gpu_arch="${{ github.event.inputs.gpu_arch }}"
          if [ -z "$gpu_arch" ]; then
            gpu_arch="gfx1103"
          fi

          device_version="${{ github.event.inputs.device_version }}"
          if [ -z "$device_version" ]; then
            device_version="device-${gpu_arch}"
          fi

          ollama_tag="${{ github.event.inputs.ollama_tag }}"
          if [ -z "$ollama_tag" ]; then
            ollama_tag="${gpu_arch}-ollama"
          fi

          comfyui_tag="${{ github.event.inputs.comfyui_tag }}"
          if [ -z "$comfyui_tag" ]; then
            comfyui_tag="${gpu_arch}-comfyui"
          fi

          echo "image_name=$image_name" >> "$GITHUB_OUTPUT"
          echo "ollama_tag=$ollama_tag" >> "$GITHUB_OUTPUT"
          echo "comfyui_tag=$comfyui_tag" >> "$GITHUB_OUTPUT"
          echo "ollama_nightly_tag=nightly-${gpu_arch}-ollama" >> "$GITHUB_OUTPUT"
          echo "comfyui_nightly_tag=nightly-${gpu_arch}-comfyui" >> "$GITHUB_OUTPUT"
          echo "rocm_downloads_url=$rocm_downloads_url" >> "$GITHUB_OUTPUT"
          echo "gpu_arch=$gpu_arch" >> "$GITHUB_OUTPUT"
          echo "device_version=$device_version" >> "$GITHUB_OUTPUT"

      - name: Build and push ollama
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ollama
          push: true
          tags: |
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.ollama_tag }}
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.ollama_nightly_tag }}
          build-args: |
            ROCM_DOWNLOADS_URL=${{ steps.meta.outputs.rocm_downloads_url }}
            GPU_ARCH=${{ steps.meta.outputs.gpu_arch }}
            DEVICE_VERSION=${{ steps.meta.outputs.device_version }}
          cache-from: type=gha,scope=ollama-${{ steps.meta.outputs.gpu_arch }}
          cache-to: type=gha,mode=min,scope=ollama-${{ steps.meta.outputs.gpu_arch }}

      - name: Build and push comfyui
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: comfyui
          push: true
          tags: |
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.comfyui_tag }}
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.comfyui_nightly_tag }}
          build-args: |
            ROCM_DOWNLOADS_URL=${{ steps.meta.outputs.rocm_downloads_url }}
            DEVICE_VERSION=${{ steps.meta.outputs.device_version }}
          cache-from: type=gha,scope=comfyui-${{ steps.meta.outputs.gpu_arch }}
          cache-to: type=gha,mode=min,scope=comfyui-${{ steps.meta.outputs.gpu_arch }}
